name: Build Tamara APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TamaraCalculator_AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - run: unzip -q TamaraCalculator_AndroidStudio.zip

      - name: Build APK
        working-directory: TamaraCalculator
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TamaraCalculator-APK
          path: TamaraCalculator/app/build/outputs/apk/debug/app-debug.apk
